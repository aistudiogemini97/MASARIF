<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Gold Coin Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Emerald Leaf/Roof Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <!-- Inner Shadow / Glow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#059669" flood-opacity="0.35" />
    </filter>
    
    <filter id="coinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#b45309" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- App Rounded Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="24" y="24" width="464" height="464" rx="112" stroke="white" stroke-width="6" stroke-opacity="0.2" />

  <!-- Background Decorative Shield Lines -->
  <path d="M256 70 C330 110 400 110 400 230 C400 350 256 420 256 420 C256 420 112 350 112 230 C112 110 182 110 256 70 Z" 
        fill="white" fill-opacity="0.04" stroke="white" stroke-width="2" stroke-opacity="0.1" />

  <!-- Stylized Family House Roof (Geometric Modern) -->
  <path d="M256 128 L374 220 C382 226 378 238 368 238 L348 238 L348 340 C348 350 340 358 330 358 L182 358 C172 358 164 350 164 340 L164 238 L144 238 C134 238 130 226 138 220 L256 128 Z" 
        fill="white" fill-opacity="0.12" />

  <!-- Roof Arch (Glowing Emerald & Teal Accent) -->
  <path d="M256 120 L386 222 C396 230 390 246 378 246 L356 246 L256 166 L156 246 L134 246 C122 246 116 230 126 222 L256 120 Z" 
        fill="url(#accentGrad)" />

  <!-- Family Pillar Base -->
  <path d="M192 270 L192 344 C192 352 198 358 206 358 L306 358 C314 358 320 352 320 344 L320 270" 
        stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.3" />

  <!-- Central Golden Prosperity Coin Emblem -->
  <circle cx="256" cy="276" r="68" fill="url(#goldGrad)" filter="url(#coinShadow)" />
  <circle cx="256" cy="276" r="54" stroke="white" stroke-width="3" stroke-dasharray="8 6" stroke-opacity="0.6" fill="none" />
  
  <!-- Coin Center Currency / Growth Symbol (Arabic Rayal / Growth Vector) -->
  <path d="M256 240 L256 312 M236 260 L276 260 M236 292 L276 292" 
        stroke="#78350f" stroke-width="9" stroke-linecap="round" />

  <!-- Sparkle Stars -->
  <!-- Top Right Sparkle -->
  <path d="M370 140 Q382 140 382 128 Q382 140 394 140 Q382 140 382 152 Q382 140 370 140 Z" fill="#fef08a" />
  <!-- Bottom Left Small Sparkle -->
  <path d="M125 315 Q133 315 133 307 Q133 315 141 315 Q133 315 133 323 Q133 315 125 315 Z" fill="#6ee7b7" />
  <!-- Top Center Small Dot -->
  <circle cx="256" cy="95" r="5" fill="#fef08a" />
</svg>
